services:
  backend:
    build:
      context: ./elearning-backend
      dockerfile: Dockerfile
    ports:
      - "5731:5731"
    volumes:
      - ./elearning-backend/uploads:/app/uploads
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
