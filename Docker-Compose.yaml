version: "3.9"

services:
  backend:
    build:
      context: ./elearning-backend   # backend folder
      dockerfile: Dockerfile
    ports:
      - "5731:5731"
    volumes:
      - ./elearning-backend/uploads:/app/uploads:ro   # read-only for security
    environment:
      NODE_ENV: production
    restart: always
    user: "1000:1000"        # run container as non-root
    read_only: true           # filesystem read-only
    tmpfs:
      - /tmp                  # temporary files in memory
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend           # frontend folder
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
    restart: always
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Docker network for isolation
networks:
  app-network:
    driver: bridge
