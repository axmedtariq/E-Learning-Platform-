version: "3.9"

services:
  backend:
    build:
      context: ./elearning-backend   # correct folder name
      dockerfile: Dockerfile
    ports:
      - "5731:5731"
    volumes:
      - ./elearning-backend/uploads:/app/uploads   # keep as-is or add :ro if needed
    environment:
      NODE_ENV: production   # fixed map style

  frontend:
    build:
      context: ./frontend            # correct frontend folder
      dockerfile: Dockerfile
    ports:
      - "80:80"
